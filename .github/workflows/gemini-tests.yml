name: Gemini provider tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/gemini-flash-lite]

jobs:
  gemini-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q main.py src tests
      - name: Run mocked Gemini tests
        run: python -m pytest -q tests/test_gemini_translator.py
